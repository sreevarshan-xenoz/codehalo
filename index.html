<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>CodeHalo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="hud-root" class="hud-wrapper">
      <!-- Collapsed HUD Pill -->
      <div id="hud-pill" class="hud-pill" title="Click to expand details">
        <span class="hud-pill-indicator"></span>
        <span class="hud-pill-title">CodeHalo</span>
        <div id="hud-summary" class="hud-summary">
          <span id="pill-status-label">Ready</span>
          <span class="edge-tag" id="pill-edge-tag">TOP</span>
        </div>
      </div>

      <!-- Expanded Overlay Drawer -->
      <div id="hud-drawer" class="hud-drawer">
        <div class="drawer-header">
          <span class="drawer-title">Display & Position</span>
          <div class="drawer-actions">
            <button id="btn-collapse" class="btn-icon" title="Collapse">✕</button>
          </div>
        </div>

        <!-- Monitor & Edge Controls -->
        <div class="controls-section">
          <div class="control-row">
            <label for="monitor-select">Display</label>
            <select id="monitor-select" class="select-input">
              <option value="0">Detecting displays...</option>
            </select>
          </div>

          <div class="control-row">
            <label>Screen Edge</label>
            <div class="edge-buttons">
              <button class="btn-edge active" data-edge="top">Top</button>
              <button class="btn-edge" data-edge="bottom">Bottom</button>
              <button class="btn-edge" data-edge="left">Left</button>
              <button class="btn-edge" data-edge="right">Right</button>
            </div>
          </div>
        </div>

        <div class="hud-status-card">
          <div class="status-row">
            <span>Window Type</span>
            <span class="status-value">Frameless / Transparent</span>
          </div>
          <div class="status-row">
            <span>Always-on-top</span>
            <span class="status-value highlight">Active</span>
          </div>
          <div class="status-row">
            <span>Scale Factor</span>
            <span id="stat-scale-factor" class="status-value">1.0x</span>
          </div>
        </div>

        <div class="drawer-footer">
          <span id="status-hint">Click outside or press ✕ to collapse</span>
          <span>v0.1 Prototype</span>
        </div>
      </div>
    </div>
  </body>
</html>
