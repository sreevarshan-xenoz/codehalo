<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>AgentHUD</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="hud-root" class="hud-wrapper">
      <!-- Collapsed HUD Pill -->
      <div id="hud-pill" class="hud-pill" title="Click to expand details">
        <span class="hud-pill-indicator"></span>
        <span class="hud-pill-title">AgentHUD</span>
        <div id="hud-summary" class="hud-summary">
          <span>Claude <span class="hud-pill-tag" id="pill-claude">82%</span></span>
          <span>•</span>
          <span>Codex <span class="hud-pill-tag" id="pill-codex">61%</span></span>
        </div>
      </div>

      <!-- Expanded Overlay Drawer -->
      <div id="hud-drawer" class="hud-drawer">
        <div class="drawer-header">
          <span class="drawer-title">AI Agent Usage</span>
          <div class="drawer-actions">
            <button id="btn-refresh" class="btn-icon" title="Refresh">↻</button>
            <button id="btn-collapse" class="btn-icon" title="Collapse">✕</button>
          </div>
        </div>

        <div id="provider-container" class="provider-list">
          <!-- Dynamic provider cards rendered via TypeScript -->
        </div>

        <div class="drawer-footer">
          <span id="last-updated-text">Updated just now</span>
          <span id="mode-text">Local-First Monitor</span>
        </div>
      </div>
    </div>
  </body>
</html>
