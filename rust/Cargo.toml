[package]
name = "codehalo-rust"
version = "0.1.0"
edition = "2021"
description = "Core Rust engine and CXX-Qt bridge for CodeHalo"
authors = ["CodeHalo Contributors"]

[lib]
name = "codehalo_rust"
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = "0.7"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[build-dependencies]
cxx-qt-build = "0.7"
