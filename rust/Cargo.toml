[package]
name = "codehalo-rust"
version = "0.1.0"
edition = "2021"
description = "Core Rust engine and CXX-Qt bridge for CodeHalo"
authors = ["CodeHalo Contributors"]

[lib]
name = "codehalo_rust"
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = "0.7"

tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
cxx-qt-build = "0.7"
